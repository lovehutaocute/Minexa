name: Android CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 不用 android-actions/setup-android@v3：它会安装已从 SDK 仓库下架的 legacy `tools` 包，
      # 报 "Failed to find package 'tools'" 后以退出码 1 结束整个 job。
      # 运行器镜像已预装 Android SDK，这里只补装构建所需组件并接受许可证。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=""
          for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$candidate" ] && SDKMGR="$candidate"
          done
          if [ -z "$SDKMGR" ]; then
            echo "::error::未找到 sdkmanager（$SDK_ROOT/cmdline-tools/*/bin）"
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Ensure Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -storetype JKS \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MineServeMobile-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Release (tag)
    # Release APK 用发布密钥签名：keystore 从 Secret KEYSTORE_BASE64 还原（见下方
    # “Restore release keystore”），因此与本地 assembleRelease 是同一把密钥，可以覆盖安装。
    # 触发条件：推送 v* 标签即产出，不再要求同时走 workflow_dispatch（旧条件几乎无法命中）。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 同 build job：避免 setup-android@v3 安装已下架的 tools 包而失败。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=""
          for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$candidate" ] && SDKMGR="$candidate"
          done
          if [ -z "$SDKMGR" ]; then
            echo "::error::未找到 sdkmanager（$SDK_ROOT/cmdline-tools/*/bin）"
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # release 包必须用维护者的固定密钥签名，否则用户无法覆盖安装已发布的版本。
      # 不要像以前那样在 runner 上 `keytool -genkeypair` 现场生成——那会把发布签名换掉。
      # keystore 以 base64 存在仓库 Secret（KEYSTORE_BASE64），这里解码写回
      # signing/debug.keystore，由 app/build.gradle.kts 的 signingConfig 优先读取。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 GitHub Secret KEYSTORE_BASE64，无法用发布密钥签名"
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/debug.keystore
          EXPECTED="0b629e9ec7390136ae0c204dd95de5614261cd2e37b7b84ac6de402b5985fbdb"
          ACTUAL=$(sha256sum signing/debug.keystore | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::keystore 文件哈希不匹配（期望 $EXPECTED，实际 $ACTUAL），拒绝用错误密钥签名"
            exit 1
          fi
          keytool -list -keystore signing/debug.keystore -storepass android -alias androiddebugkey > /dev/null
          echo "发布签名密钥就绪：alias=androiddebugkey，文件 SHA-256=$ACTUAL"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # 产物签名自检：证书指纹必须等于发布密钥的 SHA-256，
      # 否则用户装不上（签名不一致会被 Android 拒绝覆盖安装）。
      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi "f229d2aa9ab55b8b2c196fc61e901c8b55fc66b5d21aae6e6cb91042f2526636" \
            || { echo "::error::release APK 的签名证书与发布密钥不一致"; exit 1; }
          echo "签名校验通过：与线上版本同一把密钥"

      # 不上传 R8 mapping.txt：它随混淆表增长体积巨大（本项目约 196 MB，而 APK 仅 14 MB），
      # 不适合挂在 Release 资产里。需要还原线上崩溃堆栈时，用同一提交本地
      # `./gradlew assembleRelease` 复现 mapping，或临时把这一步的 upload-artifact 加回来。
      - name: Resolve release notes
        id: meta
        run: |
          set -euo pipefail
          # 版本号以 build.gradle.kts 为准，避免发布说明与产物版本脱节
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CURATED="RELEASE_NOTES_${VERSION}.md"
          if [ -f "$CURATED" ]; then
            cp "$CURATED" release-notes.md
            echo "更新说明来源：$CURATED（手写精简版，适合更新弹窗阅读）"
          else
            # 回退到 CHANGELOG.md 中该版本的段落（`## <版本>` 到下一个二级标题之前）。
            # 用字符串等值比较而非正则，避开版本号里的点号被当作通配符。
            awk -v heading="## $VERSION" '
              $0 == heading { inside = 1; next }
              /^## / { inside = 0 }
              inside { print }
            ' CHANGELOG.md > release-notes.md
            echo "更新说明来源：CHANGELOG.md 的 $VERSION 段（未找到 $CURATED）"
          fi

          if [ ! -s release-notes.md ]; then
            echo "::error::既没有 $CURATED，CHANGELOG.md 里也找不到 $VERSION 段；拒绝发布空说明"
            exit 1
          fi
          echo "release-notes.md：$(wc -l < release-notes.md) 行 / $(wc -c < release-notes.md) 字节"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MineServe Mobile ${{ steps.meta.outputs.version }}
          # 发布说明由上一步生成（RELEASE_NOTES_<版本>.md 或 CHANGELOG 对应段），
          # 不再留空：空 body 会被 GitHub 存成 null，客户端解析时容易踩坑。
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
